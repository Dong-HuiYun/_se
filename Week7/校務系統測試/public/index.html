/* ----------------------------------------------------------------- */
/*  window.storage 的本機替代實作：改用瀏覽器 localStorage             */
/*  （資料只存在你這台電腦、這個瀏覽器裡，不會與任何人共用）           */
/* ----------------------------------------------------------------- */
window.storage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    if (raw === null) throw new Error("key not found: " + key);
    return { key, value: raw, shared: false };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  },
};

function scoreToGrade(score) {
  if (score === null || score === undefined || score === "") return null;
  const s = Number(score);
  if (s >= 90) return { grade: "A+", point: 4.3 };
  if (s >= 85) return { grade: "A", point: 4.0 };
  if (s >= 80) return { grade: "A-", point: 3.7 };
  if (s >= 77) return { grade: "B+", point: 3.3 };
  if (s >= 73) return { grade: "B", point: 3.0 };
  if (s >= 70) return { grade: "B-", point: 2.7 };
  if (s >= 67) return { grade: "C+", point: 2.3 };
  if (s >= 63) return { grade: "C", point: 2.0 };
  if (s >= 60) return { grade: "C-", point: 1.7 };
  if (s >= 50) return { grade: "D", point: 1.0 };
  return { grade: "F", point: 0 };
}

function computeGpa(records) {
  const graded = records.filter((r) => r.score !== null && r.score !== undefined && r.score !== "");
  if (graded.length === 0) return null;
  let points = 0, credits = 0;
  graded.forEach((r) => {
    const g = scoreToGrade(r.score);
    points += g.point * r.credit;
    credits += r.credit;
  });
  return credits ? (points / credits).toFixed(2) : null;
}

function periodsLabel(periods) {
  return periods.join(",");
}

function newId(prefix) {
  return prefix + Date.now().toString(36) + Math.floor(Math.random() * 1000);
}

function FormModal({ title, fields, initial, onCancel, onSave }) {
  const [form, setForm] = useState(initial || {});
  useEffect(() => setForm(initial || {}), [initial]);

  function update(key, value) {
    setForm((prev) => ({ ...prev, [key]: value }));
  }
  function handleSubmit(e) {
    e.preventDefault();
    onSave(form);
  }

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-sm shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto border-t-4 border-amber-700">
        <div className="flex items-center justify-between px-6 py-4 border-b border-stone-200 sticky top-0 bg-white">
          <h3 className="text-lg font-semibold text-slate-800 font-brand">{title}</h3>
          <button onClick={onCancel} className="text-stone-400 hover:text-stone-600">
            <X size={20} />
          </button>
        </div>
        <form onSubmit={handleSubmit} className="p-6 space-y-4">
          {fields.map((f) => (
            <div key={f.key}>
              <label className="block text-sm font-medium text-stone-600 mb-1">{f.label}</label>
              {f.type === "select" ? (
                <select
                  value={form[f.key] ?? ""}
                  onChange={(e) => update(f.key, f.numeric ? Number(e.target.value) : e.target.value)}
                  className="w-full border border-stone-300 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
                >
                  <option value="">請選擇</option>
                  {f.options.map((o) => (
                    <option key={o.value} value={o.value}>
                      {o.label}
                    </option>
                  ))}
                </select>
              ) : f.type === "periods" ? (
                <div className="flex flex-wrap gap-2">
                  {PERIODS.map((p) => {
                    const active = (form[f.key] || []).includes(p);
                    return (
                      <button
                        type="button"
                        key={p}
                        onClick={() => {
                          const cur = form[f.key] || [];
                          update(f.key, active ? cur.filter((x) => x !== p) : [...cur, p].sort((a, b) => a - b));
                        }}
                        className={`w-9 h-9 rounded-sm text-sm border transition-colors ${
                          active ? "bg-amber-700 text-white border-amber-700" : "border-stone-300 text-stone-600 hover:border-amber-700"
                        }`}
                      >
                        {p}
                      </button>
                    );
                  })}
                </div>
              ) : f.type === "textarea" ? (
                <textarea
                  value={form[f.key] ?? ""}
                  onChange={(e) => update(f.key, e.target.value)}
                  rows={4}
                  className="w-full border border-stone-300 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
                />
              ) : (
                <input
                  type={f.type || "text"}
                  value={form[f.key] ?? ""}
                  onChange={(e) => update(f.key, f.numeric ? Number(e.target.value) : e.target.value)}
                  className="w-full border border-stone-300 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
                />
              )}
            </div>
          ))}
          <div className="flex justify-end gap-3 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 text-sm rounded-sm border border-stone-300 text-stone-600 hover:bg-stone-50">
              取消

            <button type="submit" className="px-4 py-2 text-sm rounded-sm bg-amber-700 text-white hover:bg-amber-800">
              儲存

}

function AnnouncementsPage({ data, persist, showToast, canManage, canPost, authorName, requestConfirm }) {
  const [modal, setModal] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const sorted = [...data.announcements].sort((a, b) => (a.date < b.date ? 1 : -1));

  const fields = [
    { key: "title", label: "標題" },
    { key: "category", label: "類別", type: "select", options: ANNOUNCEMENT_CATEGORIES.map((c) => ({ value: c, label: c })) },
    { key: "date", label: "發布日期", type: "date" },
    { key: "content", label: "內容", type: "textarea" },
  ];

  function handleSave(form) {
    if (!form.title || !form.content || !form.category || !form.date) {
      showToast("請完整填寫公告內容", "error");
      return;
    }
    if (modal.mode === "add") {
      const rec = { id: newId("AN"), author: authorName, ...form };
      persist({ ...data, announcements: [rec, ...data.announcements] });
      showToast("公告已發布", "success");
    } else {
      persist({ ...data, announcements: data.announcements.map((a) => (a.id === modal.initial.id ? { ...a, ...form } : a)) });
      showToast("公告已更新", "success");
    }
    setModal(null);
  }

  function handleDelete(row) {
    requestConfirm(`確定要刪除公告「${row.title}」嗎？`, () => {
      persist({ ...data, announcements: data.announcements.filter((a) => a.id !== row.id) });
      showToast("公告已刪除", "success");
    });
  }

  return (
    <div>
      <PageHeader
        title="校園公告"
        subtitle="教務處、學務處及各單位最新消息"
        action={
          (canManage || canPost) && (
            <button
              onClick={() => setModal({ mode: "add", initial: { category: ANNOUNCEMENT_CATEGORIES[0], date: new Date().toISOString().slice(0, 10) } })}
              className="flex items-center gap-1.5 bg-amber-700 hover:bg-amber-800 text-white text-sm px-3.5 py-2 rounded-sm"
            >
              <Plus size={16} /> 發布公告
            </button>
          )
        }
      />
      <div className="space-y-3">
        {sorted.map((a) => (
          <div key={a.id} className="bg-white border border-stone-200 rounded-sm px-5 py-4">
            <div className="flex items-start justify-between gap-3">
              <button className="text-left flex-1" onClick={() => setExpanded(expanded === a.id ? null : a.id)}>
                <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                  <CategoryBadge category={a.category} />
                  <span className="text-xs text-stone-400">{a.date}</span>
                  <span className="text-xs text-stone-400">．{a.author}</span>
                </div>
                <p className="text-sm font-medium text-slate-800">{a.title}</p>
                {expanded === a.id && <p className="text-sm text-stone-600 mt-2 leading-relaxed">{a.content}</p>}
              </button>
              {canManage && (
                <div className="flex items-center gap-2 shrink-0 pt-1">
                  <button onClick={() => setModal({ mode: "edit", initial: a })} className="text-stone-400 hover:text-amber-700">
                    <Pencil size={16} />
                  </button>
                  <button onClick={() => handleDelete(a)} className="text-stone-400 hover:text-red-600">
                    <Trash2 size={16} />
                  </button>
                </div>
              )}
            </div>
          </div>
        ))}
        {sorted.length === 0 && <p className="text-sm text-stone-400 text-center py-10">目前尚無公告</p>}
      </div>
      {modal && <FormModal title={modal.mode === "add" ? "發布公告" : "編輯公告"} fields={fields} initial={modal.initial} onCancel={() => setModal(null)} onSave={handleSave} />}
    </div>
  );
}

function StudentDashboard({ data, student, setPage }) {
  const currentCredits = data.enrollments
    .filter((e) => e.studentId === student.id && e.semester === CURRENT_SEMESTER)
    .reduce((sum, e) => {
      const c = data.courses.find((c) => c.id === e.courseId);
      return sum + (c ? c.credit : 0);
    }, 0);
  const allGraded = data.grades.filter((g) => g.studentId === student.id && g.score !== null && g.score !== undefined);
  const gpa = computeGpa(allGraded) ?? "—";
  const earnedCredits = allGraded.filter((g) => g.score >= 60).reduce((s, g) => s + g.credit, 0);
  const graduationTarget = 128;
  const progress = Math.min(100, Math.round((earnedCredits / graduationTarget) * 100));
  const recentAnnouncements = [...data.announcements].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 3);

  return (
    <div>
      <PageHeader title={`您好，${student.name} 同學`} subtitle={`${student.dept}．${student.className}`} />
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <StatCard label="本學期修習學分" value={currentCredits} hint={CURRENT_SEMESTER + " 學期"} />

        <StatCard label="已修得學分" value={earnedCredits} hint={`畢業門檻 ${graduationTarget} 學分`} />
      </div>
      <div className="bg-white border border-stone-200 rounded-sm p-5 mb-6">
        <div className="flex items-center justify-between mb-2">
          <p className="text-sm font-medium text-slate-700">畢業學分達成度</p>
          <p className="text-sm text-stone-500">{progress}%</p>
        </div>
        <div className="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
          <div className="h-full bg-amber-700 rounded-full" style={{ width: progress + "%" }} />

function CourseSelectionPage({ data, persist, showToast, student, requestConfirm }) {
  const [query, setQuery] = useState("");
  const myEnrollments = data.enrollments.filter((e) => e.studentId === student.id && e.semester === CURRENT_SEMESTER);
  const myCourses = myEnrollments
    .map((e) => ({ id: e.id, enrollment: e, course: data.courses.find((c) => c.id === e.courseId) }))
    .filter((x) => x.course);
  const myCredits = myCourses.reduce((s, x) => s + x.course.credit, 0);

  const available = data.courses.filter((c) => {
    if (c.semester !== CURRENT_SEMESTER) return false;
    if (myEnrollments.some((e) => e.courseId === c.id)) return false;
    if (query && !(c.name.includes(query) || c.dept.includes(query))) return false;
    return true;
  });

  function teacherName(id) {
    return data.teachers.find((t) => t.id === id)?.name || "－";
  }
  function enrolledCount(courseId) {
    return data.enrollments.filter((e) => e.courseId === courseId && e.semester === CURRENT_SEMESTER).length;
  }

  function addCourse(course) {
    const count = enrolledCount(course.id);
    if (count >= course.capacity) {
      showToast("本課程選課人數已額滿", "error");
      return;
    }
    const conflict = myCourses.some((x) => x.course.day === course.day && x.course.periods.some((p) => course.periods.includes(p)));
    if (conflict) {
      showToast("與已選課程時間衝堂，無法加選", "error");
      return;
    }
    const rec = { id: newId("E"), studentId: student.id, courseId: course.id, semester: CURRENT_SEMESTER };
    persist({ ...data, enrollments: [...data.enrollments, rec] });
    showToast(`已加選「${course.name}」`, "success");
  }

  function dropCourse(enrollment, courseName) {
    requestConfirm(`確定要退選「${courseName}」嗎？`, () => {
      persist({ ...data, enrollments: data.enrollments.filter((e) => e.id !== enrollment.id) });
      showToast(`已退選「${courseName}」`, "success");
    });
  }

  return (
    <div>
      <PageHeader title="加退選課" subtitle={`${CURRENT_SEMESTER} 學期．目前已選 ${myCourses.length} 門課，共 ${myCredits} 學分`} />

      <div className="bg-white border border-stone-200 rounded-sm mb-6">
        <div className="px-5 py-3 border-b border-stone-200">
          <p className="text-sm font-medium text-slate-700">已選課程</p>
        </div>
        <DataTable
          columns={[
            { key: "name", label: "課程名稱", render: (r) => r.course.name },
            { key: "teacher", label: "授課教師", render: (r) => teacherName(r.course.teacherId) },
            { key: "credit", label: "學分", render: (r) => r.course.credit },
            { key: "time", label: "上課時間", render: (r) => `星期${r.course.day} 第${periodsLabel(r.course.periods)}節` },
            { key: "classroom", label: "教室", render: (r) => r.course.classroom },
          ]}
          rows={myCourses}
          onDelete={(r) => dropCourse(r.enrollment, r.course.name)}
        />
      </div>

      <div className="bg-white border border-stone-200 rounded-sm">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between gap-3 flex-wrap">
          <p className="text-sm font-medium text-slate-700">可加選課程</p>
          <div className="relative">
            <Search size={14} className="absolute left-2.5 top-2.5 text-stone-400" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="搜尋課程名稱或系所"
              className="pl-8 pr-3 py-1.5 text-sm border border-stone-300 rounded-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
            />
          </div>
        </div>
        <DataTable
          columns={[
            { key: "name", label: "課程名稱" },
            { key: "teacher", label: "授課教師", render: (r) => teacherName(r.teacherId) },
            { key: "credit", label: "學分" },
            { key: "dept", label: "開課系所" },
            { key: "time", label: "上課時間", render: (r) => `星期${r.day} 第${periodsLabel(r.periods)}節` },
            {
              key: "capacity",
              label: "選課人數",
              render: (r) => {
                const count = enrolledCount(r.id);
                const full = count >= r.capacity;
                return <span className={full ? "text-red-600" : "text-stone-600"}>{count} / {r.capacity}{full ? "（額滿）" : ""}</span>;
              },
            },
            {
              key: "action",
              label: "",
              render: (r) => (
                <button
                  onClick={() => addCourse(r)}
                  disabled={enrolledCount(r.id) >= r.capacity}
                  className="text-xs px-3 py-1.5 rounded-sm bg-amber-700 hover:bg-amber-800 disabled:bg-stone-200 disabled:text-stone-400 text-white"
                >
                  加選
                </button>
              ),
            },
          ]}
          rows={available}
        />
      </div>
    </div>
  );
}

function getSemesterRows(data, studentId, semester) {
  if (semester === CURRENT_SEMESTER) {
    return data.enrollments
      .filter((e) => e.studentId === studentId && e.semester === semester)
      .map((e) => {
        const course = data.courses.find((c) => c.id === e.courseId);
        const gradeRecord = data.grades.find((g) => g.studentId === studentId && g.courseId === e.courseId && g.semester === semester);
        const teacher = course ? data.teachers.find((t) => t.id === course.teacherId) : null;
        return {
          id: e.id,
          courseName: course ? course.name : "未知課程",
          credit: course ? course.credit : 0,
          teacherName: teacher ? teacher.name : "－",
          score: gradeRecord ? gradeRecord.score : null,
        };
      });
  }
  return data.grades.filter((g) => g.studentId === studentId && g.semester === semester);
}

function GradesPage({ data, studentId }) {
  const [semester, setSemester] = useState(CURRENT_SEMESTER);
  const rows = getSemesterRows(data, studentId, semester);
  const semesterGpa = computeGpa(rows.filter((r) => r.score !== null));
  const allGraded = data.grades.filter((g) => g.studentId === studentId && g.score !== null && g.score !== undefined);
  const cumulativeGpa = computeGpa(allGraded) ?? "—";
  const earnedCredits = allGraded.filter((g) => g.score >= 60).reduce((s, g) => s + g.credit, 0);

  return (
    <div>
      <PageHeader
        title="成績查詢"
        subtitle="依學期查詢修課成績與學期平均"
        action={
          <select
            value={semester}
            onChange={(e) => setSemester(e.target.value)}
            className="border border-stone-300 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
          >
            {SEMESTERS.map((s) => (
              <option key={s} value={s}>
                {s} 學期
              </option>
            ))}
          </select>
        }
      />
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <StatCard label="本學期平均 GPA" value={semesterGpa ?? "—"} />
        <StatCard label="累計 GPA" value={cumulativeGpa} />
        <StatCard label="累計已修得學分" value={earnedCredits} />
      </div>
      <DataTable
        columns={[
          { key: "courseName", label: "課程名稱" },
          { key: "credit", label: "學分" },
          { key: "teacherName", label: "授課教師" },
          {
            key: "score",
            label: "分數",
            render: (r) => (r.score === null || r.score === undefined ? <span className="text-stone-400">尚未登錄</span> : r.score),
          },
          {
            key: "grade",
            label: "等第",
            render: (r) => {
              const g = scoreToGrade(r.score);
              return g ? g.grade : "－";
            },
          },
        ]}
        rows={rows}
      />
    </div>
  );
}

function GradeEntryPage({ data, persist, showToast, teacherId }) {
  const myCourses = data.courses.filter((c) => c.teacherId === teacherId && c.semester === CURRENT_SEMESTER);
  const [courseId, setCourseId] = useState(myCourses[0]?.id || "");
  const [scores, setScores] = useState({});

  const course = myCourses.find((c) => c.id === courseId);
  const roster = useMemo(() => {
    if (!course) return [];
    return data.enrollments
      .filter((e) => e.courseId === course.id && e.semester === CURRENT_SEMESTER)
      .map((e) => {
        const student = data.students.find((s) => s.id === e.studentId);
        const gradeRecord = data.grades.find((g) => g.studentId === e.studentId && g.courseId === course.id && g.semester === CURRENT_SEMESTER);
        return { student, gradeRecord };
      })
      .filter((r) => r.student);
  }, [data, course]);

  useEffect(() => {
    const init = {};
    roster.forEach((r) => {
      init[r.student.id] = r.gradeRecord ? String(r.gradeRecord.score) : "";
    });
    setScores(init);
    // eslint-disable-next-line
  }, [courseId, data]);

  function updateScore(studentId, value) {
    setScores((prev) => ({ ...prev, [studentId]: value }));
  }

  function saveAll() {
    if (!course) return;
    const teacher = data.teachers.find((t) => t.id === teacherId);
    let updatedGrades = [...data.grades];
    let hasInvalid = false;
    let changed = 0;

    roster.forEach((r) => {
      const raw = scores[r.student.id];
      if (raw === "" || raw === undefined) return;
      const num = Number(raw);
      if (Number.isNaN(num) || num < 0 || num > 100) {
        hasInvalid = true;
        return;
      }
      const existingIdx = updatedGrades.findIndex((g) => g.studentId === r.student.id && g.courseId === course.id && g.semester === CURRENT_SEMESTER);
      if (existingIdx >= 0) {
        if (updatedGrades[existingIdx].score !== num) {
          updatedGrades[existingIdx] = { ...updatedGrades[existingIdx], score: num };
          changed++;
        }
      } else {
        updatedGrades.push({
          id: newId("G"),
          studentId: r.student.id,
          courseId: course.id,
          semester: CURRENT_SEMESTER,
          courseName: course.name,
          credit: course.credit,
          teacherName: teacher ? teacher.name : "",
          score: num,
        });
        changed++;
      }
    });

    if (hasInvalid) {
      showToast("分數需介於 0 至 100 之間，請檢查後再儲存", "error");
      return;
    }
    if (changed === 0) {
      showToast("沒有變更的成績可以儲存", "error");
      return;
    }
    persist({ ...data, grades: updatedGrades });
    showToast(`已儲存 ${changed} 筆成績`, "success");
  }

  return (
    <div>
      <PageHeader
        title="成績登錄"
        subtitle={`${CURRENT_SEMESTER} 學期`}
        action={
          <select
            value={courseId}
            onChange={(e) => setCourseId(e.target.value)}
            className="border border-stone-300 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
          >
            {myCourses.map((c) => (
              <option key={c.id} value={c.id}>
                {c.name}
              </option>
            ))}
          </select>
        }
      />
      {!course ? (
        <p className="text-sm text-stone-400 text-center py-10">本學期尚無任教課程</p>
      ) : (
        <div className="bg-white border border-stone-200 rounded-sm">
          <table className="min-w-full text-sm">
            <thead className="bg-stone-50 border-b border-stone-200">
              <tr>
                <th className="text-left px-4 py-3 font-medium text-stone-500">學號</th>
                <th className="text-left px-4 py-3 font-medium text-stone-500">姓名</th>
                <th className="text-left px-4 py-3 font-medium text-stone-500">系級</th>
                <th className="text-left px-4 py-3 font-medium text-stone-500 w-32">分數</th>
                <th className="text-left px-4 py-3 font-medium text-stone-500">等第</th>
              </tr>
            </thead>
            <tbody>
              {roster.map((r) => (
                <tr key={r.student.id} className="border-b border-stone-100 last:border-0">
                  <td className="px-4 py-3 text-stone-700">{r.student.account}</td>
                  <td className="px-4 py-3 text-stone-700">{r.student.name}</td>
                  <td className="px-4 py-3 text-stone-700">{r.student.className}</td>
                  <td className="px-4 py-3">
                    <input
                      type="number"
                      min="0"
                      max="100"
                      value={scores[r.student.id] ?? ""}
                      onChange={(e) => updateScore(r.student.id, e.target.value)}
                      className="w-20 border border-stone-300 rounded-sm px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-700/40"
                    />
                  </td>
                  <td className="px-4 py-3 text-stone-500">{scoreToGrade(scores[r.student.id])?.grade ?? "－"}</td>
                </tr>
              ))}
              {roster.length === 0 && (
                <tr>
                  <td colSpan={5} className="px-4 py-10 text-center text-stone-400">
                    本課程尚無選課學生
                  </td>
                </tr>
              )}
            </tbody>
          </table>
          {roster.length > 0 && (
            <div className="px-4 py-4 border-t border-stone-200 flex justify-end">
              <button onClick={saveAll} className="bg-amber-700 hover:bg-amber-800 text-white text-sm px-4 py-2 rounded-sm">
                儲存全部成績
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [currentUser, setCurrentUser] = useState(null); // { role, id }
  const [page, setPage] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        if (mounted) setData(res && res.value ? JSON.parse(res.value) : seedData());
        if (!res || !res.value) {
          try {
            await window.storage.set(STORAGE_KEY, JSON.stringify(seedData()), true);
          } catch (e) {
            /* ignore */
          }
        }
      } catch (e) {
        if (mounted) setData(seedData());
      } finally {
        if (mounted) setLoading(false);
      }
    })();
    return () => {
      mounted = false;
    };
  }, []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(t);
  }, [toast]);

  function showToast(message, type = "success") {
    setToast({ message, type });
  }

  function requestConfirm(message, onConfirm) {
    setConfirmState({ message, onConfirm });
  }

  async function persist(newData) {
    setData(newData);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(newData), true);
    } catch (e) {
      showToast("儲存失敗，變更暫存於本機瀏覽階段", "error");
    }
  }

  async function resetData() {
    requestConfirm("確定要將系統資料重設為初始示範資料嗎？此動作將清除所有使用者的變更。", async () => {
      const seed = seedData();
      await persist(seed);
      showToast("已重設為示範資料", "success");
      setConfirmState(null);
    });
  }

  function handleLogin(role, id) {
    setCurrentUser({ role, id });
    setPage("dashboard");
  }

  function handleLogout() {
    setCurrentUser(null);
    setPage("dashboard");
  }

  function handleChangePassword(oldPw, newPw, confirmPw) {
    if (!oldPw || !newPw) {
      showToast("請輸入完整密碼欄位", "error");
      return false;
    }
    if (newPw.length < 4) {
      showToast("新密碼至少需要4碼", "error");
      return false;
    }
    if (newPw !== confirmPw) {
      showToast("兩次輸入的新密碼不一致", "error");
      return false;
    }
    const key = currentUser.role === "student" ? "students" : currentUser.role === "teacher" ? "teachers" : "admins";
    const record = data[key].find((u) => u.id === currentUser.id);
    if (!record || record.password !== oldPw) {
      showToast("目前密碼輸入錯誤", "error");
      return false;
    }
    persist({ ...data, [key]: data[key].map((u) => (u.id === currentUser.id ? { ...u, password: newPw } : u)) });
    showToast("密碼已更新", "success");
    return true;
  }

  const style = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
      .font-brand { font-family: 'Noto Serif TC', serif; }
      .font-ui { font-family: 'Noto Sans TC', 'Noto Sans', sans-serif; }
    `}</style>
  );

  if (loading || !data) {
    return (
      <div className="min-h-screen bg-stone-100 flex items-center justify-center font-ui">
        {style}
        <p className="text-stone-400 text-sm">系統載入中…</p>
      </div>
    );
  }

  if (!currentUser) {
    return (
      <div className="font-ui">
        {style}
        <LoginScreen data={data} onLogin={handleLogin} />
        <Toast toast={toast} />
      </div>
    );
  }

  const studentMenu = [
    { key: "dashboard", label: "首頁", icon: LayoutDashboard },
    { key: "profile", label: "個人資料", icon: User },
    { key: "schedule", label: "課表查詢", icon: CalendarDays },
    { key: "courseSelection", label: "加退選課", icon: BookOpen },
    { key: "grades", label: "成績查詢", icon: ClipboardList },
    { key: "announcements", label: "校園公告", icon: Megaphone },
  ];
  const teacherMenu = [
    { key: "dashboard", label: "首頁", icon: LayoutDashboard },
    { key: "myCourses", label: "任教課程", icon: BookOpen },
    { key: "gradeEntry", label: "成績登錄", icon: ClipboardList },
    { key: "announcements", label: "校園公告", icon: Megaphone },
    { key: "profile", label: "個人資料", icon: User },
  ];
  const adminMenu = [
    { key: "dashboard", label: "系統總覽", icon: LayoutDashboard },
    { key: "students", label: "學生管理", icon: Users },
    { key: "teachers", label: "教師管理", icon: Users },
    { key: "courses", label: "課程管理", icon: BookOpen },
    { key: "announcements", label: "公告管理", icon: Megaphone },
    { key: "profile", label: "個人資料", icon: User },
  ];

  let menu, roleLabel, userName, content;

  if (currentUser.role === "student") {
    const student = data.students.find((s) => s.id === currentUser.id);
    menu = studentMenu;
    roleLabel = "學生";
    userName = student.name;
    if (page === "dashboard") content = <StudentDashboard data={data} student={student} setPage={setPage} />;
    else if (page === "profile")
      content = (
        <ProfilePage
          roleLabel="學生資料"
          extraFields={[
            { label: "學號", value: student.account },
            { label: "系所", value: student.dept },
            { label: "年級", value: `${student.year} 年級` },
            { label: "班級", value: student.className },
          ]}
          onChangePassword={handleChangePassword}
        />
      );
    else if (page === "schedule") content = <SchedulePage data={data} studentId={student.id} />;
    else if (page === "courseSelection") content = <CourseSelectionPage data={data} persist={persist} showToast={showToast} student={student} requestConfirm={requestConfirm} />;
    else if (page === "grades") content = <GradesPage data={data} studentId={student.id} />;
    else if (page === "announcements") content = <AnnouncementsPage data={data} persist={persist} showToast={showToast} canManage={false} canPost={false} requestConfirm={requestConfirm} />;
  } else if (currentUser.role === "teacher") {
    const teacher = data.teachers.find((t) => t.id === currentUser.id);
    menu = teacherMenu;
    roleLabel = "教師";
    userName = teacher.name;
    if (page === "dashboard") content = <TeacherDashboard data={data} teacher={teacher} setPage={setPage} />;
    else if (page === "myCourses") content = <MyCoursesPage data={data} teacherId={teacher.id} />;
    else if (page === "gradeEntry") content = <GradeEntryPage data={data} persist={persist} showToast={showToast} teacherId={teacher.id} />;
    else if (page === "announcements")
      content = <AnnouncementsPage data={data} persist={persist} showToast={showToast} canManage={false} canPost={true} authorName={teacher.name} requestConfirm={requestConfirm} />;
    else if (page === "profile")
      content = (
        <ProfilePage
          roleLabel="教師資料"
          extraFields={[
            { label: "教師編號", value: teacher.account },
            { label: "系所", value: teacher.dept },
            { label: "職稱", value: teacher.title },
          ]}
          onChangePassword={handleChangePassword}
        />
      );
  } else {
    const admin = data.admins.find((a) => a.id === currentUser.id);
    menu = adminMenu;
    roleLabel = "管理者";
    userName = admin.name;
    if (page === "dashboard") content = <AdminDashboard data={data} resetData={resetData} />;
    else if (page === "students") content = <StudentManagementPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
    else if (page === "teachers") content = <TeacherManagementPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
    else if (page === "courses") content = <CourseManagementPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
    else if (page === "announcements")
      content = <AnnouncementsPage data={data} persist={persist} showToast={showToast} canManage={true} canPost={true} authorName="教務處" requestConfirm={requestConfirm} />;
    else if (page === "profile")
      content = <ProfilePage roleLabel="管理者資料" extraFields={[{ label: "帳號", value: admin.account }]} onChangePassword={handleChangePassword} />;
  }

  return (
    <div className="font-ui flex min-h-screen bg-stone-50">
      {style}
      <Sidebar menu={menu} page={page} setPage={setPage} roleLabel={roleLabel} userName={userName} onLogout={handleLogout} />
      <main className="flex-1 p-6 md:p-8 max-w-6xl">{content}</main>
      <Toast toast={toast} />
      <ConfirmDialog
        confirmState={confirmState}
        onCancel={() => setConfirmState(null)}
        onConfirm={() => {
          if (confirmState && confirmState.onConfirm) confirmState.onConfirm();
          setConfirmState(null);
        }}
      />
    </div>
  );
}


</script>
<script>
  // 使用 classic runtime：新版 Babel 預設的 automatic runtime 會產生
  // import ... from "react/jsx-runtime"，在一般 <script> 中會失敗導致空白頁。
  const source = document.getElementById("app-source").textContent;
  const transformed = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  (0, eval)(transformed);
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
</script>
