<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國立金門大學 - 教務資訊系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons UMD -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    .font-brand { font-family: 'Noto Serif TC', serif; }
    .font-ui { font-family: 'Noto Sans TC', 'Noto Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f5f5f4; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
  </style>
</head>
<body class="bg-stone-50 text-slate-800 font-ui antialiased selection:bg-amber-100 selection:text-amber-900">
  <div id="root"></div>

  <!-- 依序載入獨立拆分的模組檔案 -->
<!-- 載入資料模組 (data/ 目錄) -->
<script type="text/babel" src="data/constants.js"></script>
<script type="text/babel" src="data/students.js"></script>
<script type="text/babel" src="data/teachers.js"></script>
<script type="text/babel" src="data/admins.js"></script>
<script type="text/babel" src="data/courses.js"></script>
<script type="text/babel" src="data/enrollments.js"></script>
<script type="text/babel" src="data/grades.js"></script>
<script type="text/babel" src="data/announcements.js"></script>
<script type="text/babel" src="data/applications.js"></script>
<script type="text/babel" src="data/storage.js"></script>

<!-- 載入 UI 與頁面模組 -->
<script type="text/babel" src="icons.js"></script>
<script type="text/babel" src="announcements.js"></script>
<script type="text/babel" src="applications.js"></script>
<script type="text/babel" src="student.js"></script>
<script type="text/babel" src="teacher.js"></script>
<script type="text/babel" src="admin.js"></script>
<script type="text/babel" src="auth.js"></script>

  <!-- 入口主框架與路由控制器 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    /**
     * 主版面側邊欄導航 (Sidebar Layout Component)
     */
    function Sidebar({ menu, page, setPage, roleLabel, userName, onLogout }) {
      return (
        <aside className="w-full md:w-60 shrink-0 bg-slate-900 text-slate-300 flex flex-col md:min-h-screen select-none shadow-xl">
          {/* 校徽與系統標題 */}
          <div className="px-5 py-5 flex items-center gap-3 border-b border-slate-800">
            <div className="w-10 h-10 rounded-full bg-slate-800 border border-amber-600/80 flex items-center justify-center shrink-0 shadow-inner">
              <GraduationCap className="text-amber-500" size={20} />
            </div>
            <div className="leading-tight">
              <p className="text-sm font-bold text-white font-brand tracking-wider">國立金門大學</p>
              <p className="text-[11px] text-slate-400 font-mono mt-0.5">教務資訊系統</p>
            </div>
          </div>

          {/* 導航功能清單 */}
          <nav className="flex-1 py-4 space-y-0.5 overflow-y-auto">
            {menu.map((item) => {
              const Icon = item.icon;
              const active = page === item.key;
              return (
                <button
                  key={item.key}
                  onClick={() => setPage(item.key)}
                  className={`w-full flex items-center gap-3 px-5 py-2.5 text-sm transition-all border-l-3 ${
                    active
                      ? "bg-slate-800 text-amber-400 border-amber-500 font-semibold"
                      : "border-transparent text-slate-400 hover:bg-slate-800/60 hover:text-slate-200"
                  }`}
                >
                  <Icon size={16} />
                  {item.label}
                </button>
              );
            })}
          </nav>

          {/* 底部使用者資訊與登出區塊 */}
          <div className="px-5 py-4 border-t border-slate-800 bg-slate-950/40">
            <span className="inline-block text-[10px] px-2 py-0.5 bg-slate-800 text-amber-400 rounded-xs mb-1 font-medium">
              {roleLabel}
            </span>
            <p className="text-sm font-medium text-slate-200 mb-3 truncate">{userName}</p>
            <button
              onClick={onLogout}
              className="flex items-center gap-2 text-xs text-slate-400 hover:text-red-400 transition-colors"
            >
              <LogOut size={13} /> 登出系統
            </button>
          </div>
        </aside>
      );
    }

    /**
     * 主應用程式框架 (Main Application Root)
     */
    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [currentUser, setCurrentUser] = useState(null); // { role: "student" | "teacher" | "admin", id: string }
      const [page, setPage] = useState("dashboard");
      const [toast, setToast] = useState(null);
      const [confirmState, setConfirmState] = useState(null);
      const [passwordPrompt, setPasswordPrompt] = useState(false);

      // 初始化載入資料
      useEffect(() => {
        if (typeof EAS_STORAGE !== "undefined") {
          const stored = EAS_STORAGE.load();
          setData(stored);
        }
        setLoading(false);
      }, []);

      // 吐司通知自動淡出
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3000);
        return () => clearTimeout(timer);
      }, [toast]);

      function showToast(message, type = "success") {
        setToast({ message, type });
      }

      function requestConfirm(message, onConfirm) {
        setConfirmState({ message, onConfirm });
      }

      function persist(newData) {
        setData(newData);
        if (typeof EAS_STORAGE !== "undefined") {
          EAS_STORAGE.save(newData);
        }
      }

      function resetData() {
        requestConfirm("確定要將系統資料重設為初始示範資料嗎？此動作將清除所有自訂變更紀錄。", () => {
          if (typeof EAS_STORAGE !== "undefined") {
            const fresh = EAS_STORAGE.reset();
            setData(fresh);
            showToast("已成功重設為初始示範資料", "success");
          }
        });
      }

      function handleLogin(role, id) {
        setCurrentUser({ role, id });
        setPage("dashboard");
        // 學生登入後彈窗詢問是否要修改密碼（管理者無法得知學生變更後的密碼）
        // 僅在「尚未自行修改過密碼」時才彈出；一旦學生改過，往後登入就不再詢問，
        // 除非管理者又幫忙重設了新密碼（此時 passwordChanged 會被清除為 false）
        if (role === "student") {
          const student = data.students.find((s) => s.id === id);
          if (!student || !student.passwordChanged) {
            setPasswordPrompt(true);
          }
        }
      }

      function handleLogout() {
        setCurrentUser(null);
        setPage("dashboard");
        setPasswordPrompt(false);
      }

      function handleChangePassword(oldPw, newPw, confirmPw) {
        if (!oldPw || !newPw) {
          showToast("請輸入完整密碼欄位", "error");
          return false;
        }
        if (newPw.length < 4) {
          showToast("新密碼長度至少需要4碼", "error");
          return false;
        }
        if (newPw !== confirmPw) {
          showToast("兩次輸入的新密碼不一致", "error");
          return false;
        }
        const key = currentUser.role === "student" ? "students" : currentUser.role === "teacher" ? "teachers" : "admins";
        const record = data[key].find((u) => u.id === currentUser.id);
        if (!record || record.password !== oldPw) {
          showToast("目前密碼輸入錯誤", "error");
          return false;
        }
        persist({
          ...data,
          [key]: data[key].map((u) =>
            u.id === currentUser.id ? { ...u, password: newPw, ...(currentUser.role === "student" ? { passwordChanged: true } : {}) } : u
          ),
        });
        showToast("密碼已成功更新", "success");
        return true;
      }

      if (loading || !data) {
        return (
          <div className="min-h-screen bg-stone-100 flex items-center justify-center">
            <p className="text-stone-400 text-sm animate-pulse">系統載入中…</p>
          </div>
        );
      }

      // 未登入時顯示登入視窗
      if (!currentUser) {
        return (
          <div>
            <LoginScreen data={data} onLogin={handleLogin} />
            <Toast toast={toast} />
          </div>
        );
      }

      // 依登入角色組裝選單與內容
      let menu = [];
      let roleLabel = "";
      let userName = "";
      let content = null;

      if (currentUser.role === "student") {
        const student = data.students.find((s) => s.id === currentUser.id);
        menu = [
          { key: "dashboard", label: "首頁總覽", icon: LayoutDashboard },
          { key: "profile", label: "個人資料", icon: User },
          { key: "schedule", label: "課表查詢", icon: CalendarDays },
          { key: "courseSelection", label: "加退選課", icon: BookOpen },
          { key: "grades", label: "成績查詢", icon: ClipboardList },
          { key: "transcript", label: "歷年成績總表", icon: History },
          { key: "applications", label: "學籍/課程異動申請", icon: FileText },
          { key: "announcements", label: "校園公告", icon: Megaphone },
        ];
        roleLabel = "在校學生";
        userName = student ? student.name : "學生";

        if (page === "dashboard") content = <StudentDashboard data={data} student={student} setPage={setPage} />;
        else if (page === "profile") content = (
          <ProfilePage
            roleLabel="學生學籍資料"
            extraFields={[
              { label: "學號", value: student.account },
              { label: "就讀系所", value: student.dept },
              { label: "目前年級", value: `${student.year} 年級` },
              { label: "所屬班級", value: student.className },
              { label: "學籍狀態", value: studentStatusLabel(student) },
            ]}
            onChangePassword={handleChangePassword}
          />
        );
        else if (page === "schedule") content = <SchedulePage data={data} studentId={student.id} />;
        else if (page === "courseSelection") content = <CourseSelectionPage data={data} persist={persist} showToast={showToast} student={student} requestConfirm={requestConfirm} />;
        else if (page === "grades") content = <GradesPage data={data} studentId={student.id} />;
        else if (page === "transcript") content = <TranscriptPage data={data} studentId={student.id} />;
        else if (page === "applications") content = <StudentApplicationsPage data={data} persist={persist} showToast={showToast} student={student} />;
        else if (page === "announcements") content = <AnnouncementsPage data={data} persist={persist} showToast={showToast} canManage={false} canPost={false} requestConfirm={requestConfirm} />;
      } else if (currentUser.role === "teacher") {
        const teacher = data.teachers.find((t) => t.id === currentUser.id);
        menu = [
          { key: "dashboard", label: "教師工作台", icon: LayoutDashboard },
          { key: "myCourses", label: "任教課程", icon: BookOpen },
          { key: "gradeEntry", label: "成績登錄", icon: ClipboardList },
          { key: "announcements", label: "校園公告", icon: Megaphone },
          { key: "profile", label: "個人資料", icon: User },
        ];
        roleLabel = "專任教師";
        userName = teacher ? teacher.name : "教師";

        if (page === "dashboard") content = <TeacherDashboard data={data} teacher={teacher} setPage={setPage} />;
        else if (page === "myCourses") content = <MyCoursesPage data={data} teacherId={teacher.id} />;
        else if (page === "gradeEntry") content = <GradeEntryPage data={data} persist={persist} showToast={showToast} teacherId={teacher.id} />;
        else if (page === "announcements") content = <AnnouncementsPage data={data} persist={persist} showToast={showToast} canManage={false} canPost={true} authorName={teacher.name} requestConfirm={requestConfirm} />;
        else if (page === "profile") content = (
          <ProfilePage
            roleLabel="教師人事資料"
            extraFields={[
              { label: "教師編號", value: teacher.account },
              { label: "所屬系所", value: teacher.dept },
              { label: "學術職稱", value: teacher.title },
            ]}
            onChangePassword={handleChangePassword}
          />
        );
      } else {
        const admin = data.admins.find((a) => a.id === currentUser.id);
        menu = [
          { key: "dashboard", label: "系統總覽", icon: LayoutDashboard },
          { key: "students", label: "學生管理", icon: Users },
          { key: "teachers", label: "教師管理", icon: Users },
          { key: "courses", label: "課程管理", icon: BookOpen },
          { key: "applicationReview", label: "申請案件審核", icon: FileText },
          { key: "announcements", label: "公告管理", icon: Megaphone },
          { key: "profile", label: "個人資料", icon: User },
        ];
        roleLabel = "系統管理者";
        userName = admin ? admin.name : "管理員";

        if (page === "dashboard") content = <AdminDashboard data={data} resetData={resetData} />;
        else if (page === "students") content = <StudentManagementPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
        else if (page === "teachers") content = <TeacherManagementPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
        else if (page === "courses") content = <CourseManagementPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
        else if (page === "applicationReview") content = <ApplicationReviewPage data={data} persist={persist} showToast={showToast} requestConfirm={requestConfirm} />;
        else if (page === "announcements") content = <AnnouncementsPage data={data} persist={persist} showToast={showToast} canManage={true} canPost={true} authorName="教務處" requestConfirm={requestConfirm} />;
        else if (page === "profile") content = (
          <ProfilePage
            roleLabel="管理者帳號資料"
            extraFields={[{ label: "管理員帳號", value: admin.account }]}
            onChangePassword={handleChangePassword}
          />
        );
      }

      return (
        <div className="flex flex-col md:flex-row min-h-screen bg-stone-50">
          <Sidebar
            menu={menu}
            page={page}
            setPage={setPage}
            roleLabel={roleLabel}
            userName={userName}
            onLogout={handleLogout}
          />
          <main className="flex-1 p-6 md:p-8 max-w-6xl overflow-y-auto">
            {content}
          </main>
          <Toast toast={toast} />
          <ConfirmDialog
            confirmState={confirmState}
            onCancel={() => setConfirmState(null)}
            onConfirm={() => {
              if (confirmState && confirmState.onConfirm) confirmState.onConfirm();
              setConfirmState(null);
            }}
          />
          {passwordPrompt && currentUser.role === "student" && (
            <PasswordChangePromptModal
              userName={userName}
              onSkip={() => setPasswordPrompt(false)}
              onSubmit={(oldPw, newPw, confirmPw) => {
                const ok = handleChangePassword(oldPw, newPw, confirmPw);
                if (ok) setPasswordPrompt(false);
                return ok;
              }}
            />
          )}
        </div>
      );
    }

    // 掛載至 HTML root 節點
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
