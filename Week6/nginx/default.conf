server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 反向代理：依路徑前綴轉發到不同容器（用服務名稱當主機名）
    location /api/node/   { proxy_pass http://node:3000; }
    location /api/python/ { proxy_pass http://python:5000; }
    location /api/rust/   { proxy_pass http://rust:8080; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
