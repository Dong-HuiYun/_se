name: docker-microservices

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8081:80"]          # 8080 若空閒也可改回 8080:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on: [node, python, rust]
    networks: [frontend]

  node:
    build: ./node-service
    environment:
      DATABASE_URL: postgres://${NODE_DB_USER}:${NODE_DB_PASSWORD}@db-node:5432/${NODE_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      db-node: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [frontend, net-node, mq]

  python:
    build: ./python-service
    environment:
      DATABASE_URL: postgres://${PY_DB_USER}:${PY_DB_PASSWORD}@db-python:5432/${PY_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      NODE_API: http://node:3000      # 同步呼叫 Node 的 API
      PROCESS_DELAY: "1.5"            # 模擬處理耗時，讓非同步效果看得見
    depends_on:
      db-python: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      node: { condition: service_started }
    networks: [frontend, net-python, mq]

  rust:
    build: ./rust-service
    networks: [frontend]

  db-node:                           # Node 專用資料庫
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NODE_DB_USER}
      POSTGRES_PASSWORD: ${NODE_DB_PASSWORD}
      POSTGRES_DB: ${NODE_DB_NAME}
    volumes:
      - pgdata-node:/var/lib/postgresql/data
      - ./db/node-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NODE_DB_USER} -d ${NODE_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [net-node]

  db-python:                         # Python 專用資料庫
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PY_DB_USER}
      POSTGRES_PASSWORD: ${PY_DB_PASSWORD}
      POSTGRES_DB: ${PY_DB_NAME}
    volumes:
      - pgdata-python:/var/lib/postgresql/data
      - ./db/python-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PY_DB_USER} -d ${PY_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [net-python]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports: ["15672:15672"]           # 管理介面 http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [mq]

volumes:
  pgdata-node:
  pgdata-python:

networks:
  frontend:
  net-node:     # 只有 node 與 db-node
  net-python:   # 只有 python 與 db-python
  mq:           # 只有 node、python 與 rabbitmq
