<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本機 PDF 工具箱</title>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto px-6 py-14">
    <header class="text-center mb-12">
      <span class="inline-block bg-teal-50 text-teal-700 text-xs font-semibold px-3 py-1.5 rounded-full mb-4">
        🔒 全程本機處理，檔案不會上傳
      </span>
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">本機 PDF 工具箱</h1>
      <p class="text-slate-500 max-w-xl mx-auto">
        合併、拆分、浮水印、塗黑⋯⋯所有運算都在你的瀏覽器裡完成，
        不必上傳到任何伺服器，關掉分頁資料就不留痕跡。
      </p>
    </header>

    <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></section>

    <footer class="text-center text-xs text-slate-400 mt-14">
      所有工具皆為前端運算，不會將檔案傳送到任何伺服器。
    </footer>
  </div>
  <script type="module" src="/src/home.js"></script>
</body>
</html>
