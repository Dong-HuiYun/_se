<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本機 PDF 合併工具</title>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <header class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-2xl font-bold mb-1">本機 PDF 合併工具</h1>
        <p class="text-slate-500 text-sm max-w-md">
          把多個 PDF 拖進來，跨檔案調整頁面順序、刪除不要的頁面，再合併匯出。檔案全程留在瀏覽器裡處理，不會上傳到任何地方。
        </p>
      </div>
      <span class="bg-teal-50 text-teal-700 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">
        🔒 全程本機處理
      </span>
    </header>

    <div
      id="dropzone"
      tabindex="0"
      role="button"
      aria-label="選擇或拖曳 PDF 檔案"
      class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-10 text-center cursor-pointer hover:border-teal-500 hover:bg-teal-50 transition"
    >
      <input type="file" id="fileInput" accept="application/pdf" multiple hidden />
      <p class="font-semibold">拖曳 PDF 檔案到這裡</p>
      <p class="text-slate-500 text-sm mt-1">或點擊選擇檔案，可一次選取多個檔案</p>
    </div>

    <p id="emptyState" class="text-center text-slate-500 text-sm py-6">
      加入檔案後，每一頁都會顯示縮圖，直接拖曳卡片就能調整順序。
    </p>

    <div id="toolbar" class="hidden items-center gap-4 flex-wrap my-4 bg-white border border-slate-200 rounded-lg px-4 py-3">
      <span id="stats" class="font-semibold text-sm">共 0 頁</span>
      <div class="flex items-center gap-1.5 text-sm text-slate-500 ml-auto">
        <label for="filenameInput">檔名</label>
        <input
          id="filenameInput"
          type="text"
          value="merged"
          class="border border-slate-300 rounded px-2 py-1 text-sm w-32 bg-slate-50"
        />
        <span>.pdf</span>
      </div>
      <button
        id="downloadBtn"
        disabled
        class="bg-teal-600 text-white text-sm font-semibold px-4 py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed hover:enabled:opacity-90"
      >
        下載合併後的 PDF
      </button>
    </div>

    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>

    <p id="status" role="status" class="text-center text-sm text-slate-500 mt-4 min-h-5"></p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
